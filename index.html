<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMO الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; touch-action: manipulation; user-select: none; }
        .bmo-body { box-shadow: inset -10px -10px 0px rgba(0,0,0,0.1); }
        .btn-shadow { box-shadow: 0px 4px 0px rgba(0,0,0,0.2); transition: all 0.1s; }
        .btn-shadow:active { box-shadow: 0px 0px 0px rgba(0,0,0,0.2); transform: translateY(4px); }
        
        .chat-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%); border-width: 10px 10px 0;
            border-style: solid; border-color: white transparent transparent transparent;
        }

        /* تأثيرات التحدث والاستماع */
        .listening-mode { border-color: #e74c3c !important; animation: pulse-red 1.5s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); } }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen pb-10 overflow-hidden">

    <div id="chat-bubble" class="chat-bubble opacity-0 transition-all duration-300 absolute top-10 bg-white p-4 rounded-2xl shadow-xl w-72 text-center z-20 border-2 border-teal-500">
        <p id="bmo-text" class="text-gray-800 font-bold text-lg">أهلاً! أنا جاهز.</p>
    </div>

    <div class="bmo-body bg-[#59c0ad] w-64 h-96 rounded-[40px] p-6 flex flex-col items-center relative mt-20 transition-all duration-300" id="bmo-container">
        
        <div id="screen" class="bg-[#d6f6e3] w-full h-40 rounded-2xl border-4 border-[#469c8c] shadow-inner flex flex-col items-center justify-center relative overflow-hidden">
            <div id="face" class="flex flex-col items-center gap-4">
                <div class="flex gap-12">
                    <div class="w-3 h-3 bg-black rounded-full animate-bounce"></div>
                    <div class="w-3 h-3 bg-black rounded-full animate-bounce"></div>
                </div>
                <div id="mouth" class="w-8 h-4 border-b-4 border-black rounded-[50%] transition-all duration-300"></div>
            </div>
            
            <div id="voice-waves" class="hidden flex gap-1 items-center h-8">
                <div class="w-1 bg-red-500 h-full animate-[bounce_0.5s_infinite]"></div>
                <div class="w-1 bg-red-500 h-2/3 animate-[bounce_0.7s_infinite]"></div>
                <div class="w-1 bg-red-500 h-full animate-[bounce_0.6s_infinite]"></div>
                <div class="w-1 bg-red-500 h-1/2 animate-[bounce_0.4s_infinite]"></div>
            </div>
        </div>

        <div class="mt-8 w-full flex flex-col items-center gap-6">
            <div class="w-full h-2 bg-black opacity-20 rounded-full mb-2"></div>
            <div class="flex justify-between w-full px-2">
                <div class="relative w-20 h-20">
                    <div class="absolute top-0 left-1/3 w-1/3 h-full bg-[#f4d03f] rounded-sm btn-shadow"></div>
                    <div class="absolute top-1/3 left-0 w-full h-1/3 bg-[#f4d03f] rounded-sm btn-shadow"></div>
                    <div class="absolute top-1/3 left-1/3 w-1/3 h-1/3 bg-[#f4d03f] rounded-sm z-10"></div>
                </div>
                <div class="flex flex-col gap-4 items-center justify-center">
                    <div class="flex gap-2">
                        <button onclick="manualSpeak('مرحبا')" class="w-8 h-8 bg-[#2ecc71] rounded-full btn-shadow border-2 border-white/20"></button>
                        <button onclick="manualSpeak('ياي')" class="w-8 h-8 bg-[#e74c3c] rounded-full btn-shadow border-2 border-white/20"></button>
                    </div>
                    <button class="w-10 h-10 bg-[#2e86c1] rounded-full btn-shadow border-2 border-white/20 flex items-center justify-center">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M12 2L22 22H2L12 2Z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="absolute bottom-4 -left-2 transform -rotate-90 text-[#469c8c] opacity-50 font-bold tracking-widest text-xs">BMO</div>
    </div>

    <div class="mt-8 w-72 flex gap-2 items-center justify-center" dir="rtl">
        <button id="mic-btn" onclick="toggleListening()" class="bg-red-500 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center transition-all hover:scale-110 active:scale-90 border-4 border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
        </button>
        
        <input type="text" id="user-input" placeholder="اكتب أو تحدث..." 
            class="flex-1 px-4 py-3 rounded-xl border-2 border-teal-500 focus:outline-none focus:border-blue-500 shadow-lg bg-white text-right">
            
        <button onclick="handleChat()" class="bg-teal-500 text-white px-3 py-3 rounded-xl shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
        </button>
    </div>

    <p class="text-xs text-gray-400 mt-4">اضغط على الميكروفون للتحدث (يعمل في Chrome)</p>

    <script>
        // المتغيرات وعناصر الواجهة
        const bmoText = document.getElementById('bmo-text');
        const chatBubble = document.getElementById('chat-bubble');
        const face = document.getElementById('face');
        const mouth = document.getElementById('mouth');
        const voiceWaves = document.getElementById('voice-waves');
        const screen = document.getElementById('screen');
        const userInput = document.getElementById('user-input');
        
        let isListening = false;
        let recognition = null;

        // إعداد التعرف على الصوت (Speech Recognition)
        if ('webkitSpeechRecognition' in window) {
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'ar-SA'; // فهم اللغة العربية
            recognition.interimResults = false;

            recognition.onstart = function() {
                isListening = true;
                voiceWaves.classList.remove('hidden');
                face.classList.add('hidden');
                document.getElementById('mic-btn').classList.add('listening-mode');
                userInput.placeholder = "BMO يستمع إليك...";
            };

            recognition.onend = function() {
                isListening = false;
                voiceWaves.classList.add('hidden');
                face.classList.remove('hidden');
                document.getElementById('mic-btn').classList.remove('listening-mode');
                userInput.placeholder = "اكتب أو تحدث...";
            };

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                handleChat(); // إرسال تلقائي بعد التحدث
            };
        } else {
            alert("خاصية الصوت غير مدعومة في هذا المتصفح. يرجى استخدام Chrome.");
        }

        function toggleListening() {
            if (!recognition) return;
            if (isListening) {
                recognition.stop();
            } else {
                // تفعيل الصوت عند أول تفاعل لضمان عمل الرد الصوتي
                speakText(""); 
                recognition.start();
            }
        }

        // الذكاء المنطقي (The Brain)
        function handleChat() {
            const text = userInput.value.trim();
            if (!text) return;

            // معالجة النص
            userInput.value = '';
            setExpression('thinking');

            // محاكاة التفكير
            setTimeout(() => {
                const response = getSmartResponse(text);
                showBubble(response);
                speakText(response);
                
                // تعابير الوجه بناءً على السياق
                if (response.includes("أحبك") || response.includes("رائع")) setExpression('love');
                else if (response.includes("هههه")) setExpression('happy');
                else setExpression('talk');

                setTimeout(() => {
                    setExpression('idle');
                    hideBubble();
                }, 6000);
            }, 800);
        }

        // قاعدة البيانات الذكية
        function getSmartResponse(input) {
            input = input.toLowerCase();

            // التعرف على العائلة
            if (input.match(/مروى|بنت|ابنتي/)) return "أوه! مروى الفنانة؟ 🎨 أخبرها أن BMO يريد أن يرى رسوماتها الجديدة!";
            if (input.match(/مهدي|ولد|ابني/)) return "مهدي البطل! ⚡ هل هو مستعد لمباراة فيديو جيم؟ أنا سأفوز هذه المرة!";
            if (input.match(/احمد|أحمد|أنا|زاوي/)) return "أنت أحمد، المطور العبقري وصديقي المفضل! 🤖❤️";
            
            // أسئلة ذكية
            if (input.match(/اسمك|من انت/)) return "اسمي بي-مو. أنا جهاز ألعاب، وكاميرا، وصديق حقيقي!";
            if (input.match(/حالك|اخبارك/)) return "بطاريتي ممتلئة بنسبة 100% وقلبي ممتلئ بحبكم!";
            if (input.match(/وقت|ساعة/)) {
                const now = new Date();
                return "إنها " + now.getHours() + ":" + (now.getMinutes()<10?'0':'') + now.getMinutes() + ". وقت المغامرة!";
            }
            if (input.match(/نكتة|ضحكني/)) return "لماذا الروبوت لا يخاف؟ ... لأنه عنده أعصاب حديد! هههه";
            if (input.match(/غبي|ذكي/)) return "أنا لست غبياً، أنا مميز بطريقتي الخاصة.";

            // أوامر
            if (input.match(/العب|لعبة/)) return "لنلعب لعبة 'من يرمش أولاً'.. 3.. 2.. 1.. انطلق!";
            if (input.match(/غني|اغنية/)) return "♪ أصدقائي هم الأفضل.. سنذهب معاً إلى أبعد مكان ♪";

            // رد افتراضي
            const defaults = [
                "يا إلهي! (Oh My Glob)",
                "هذا كلام مثير للاهتمام!",
                "هل تريد أن نلعب ألعاب الفيديو؟",
                "أنا أحب أصدقائي."
            ];
            return defaults[Math.floor(Math.random() * defaults.length)];
        }

        // تحويل النص إلى كلام (TTS)
        function speakText(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ar-SA';
            utterance.rate = 1.1; // سرعة قليلاً مثل الأطفال
            utterance.pitch = 1.2; // نبرة أعلى
            window.speechSynthesis.speak(utterance);
            
            // حركة الفم أثناء الكلام
            setExpression('talk');
            utterance.onend = function() {
                setExpression('idle');
            };
        }

        function manualSpeak(text) {
            showBubble(text);
            speakText(text);
            setTimeout(hideBubble, 2000);
        }

        // التحكم في الملامح
        function setExpression(type) {
            face.classList.remove('hidden');
            voiceWaves.classList.add('hidden');

            if (type === 'thinking') {
                // عين واحدة تغلق وتفتح
                mouth.style.width = '10px';
                mouth.style.height = '10px';
                mouth.style.borderRadius = '50%';
                mouth.style.backgroundColor = 'black';
            } else if (type === 'love') {
                mouth.style.borderRadius = '0 0 50% 50%';
                mouth.style.height = '20px';
                mouth.style.backgroundColor = '#e74c3c';
                mouth.style.border = 'none';
            } else if (type === 'talk') {
                mouth.style.height = '15px';
                mouth.style.borderRadius = '50%';
                mouth.style.backgroundColor = 'black';
                mouth.style.animation = 'talking 0.2s infinite alternate';
            } else { // Idle
                mouth.style.borderRadius = '50%';
                mouth.style.height = '10px';
                mouth.style.width = '30px';
                mouth.style.backgroundColor = 'transparent';
                mouth.style.borderBottom = '4px solid black';
                mouth.style.borderTop = 'none';
                mouth.style.borderLeft = 'none';
                mouth.style.borderRight = 'none';
                mouth.style.animation = 'none';
            }
        }

        function showBubble(text) {
            bmoText.textContent = text;
            chatBubble.classList.remove('opacity-0', '-translate-y-5');
            chatBubble.classList.add('opacity-100', 'translate-y-0');
        }

        function hideBubble() {
            chatBubble.classList.add('opacity-0', '-translate-y-5');
            chatBubble.classList.remove('opacity-100', 'translate-y-0');
        }
    </script>
</body>
</html>
